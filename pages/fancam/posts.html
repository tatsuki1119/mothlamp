<div id="page-title" style="display: none;">Fancamポスト一覧 [誘蛾灯の導き]</div>

<div id="page-description" style="display: none;">
    ファントムシータのFancamをメンバーや楽曲から絞り込んで閲覧できます。
</div>

<link rel="stylesheet" href="/static/css/fancam_public.css">
<link rel="stylesheet" href="/static/css/fancam_report.css">
<link rel="stylesheet" href="/static/css/fancam_posts.css">

<div class="contents_block">
    <h1 class="glitch-text">Fancamポスト一覧</h1>

    <p>
        登録されているFancamをメンバーや楽曲などから絞り込んで表示します。
    </p>

    <div class="fancam-page-nav">
        <a href="/?p=fancam.list" class="fancam-nav-link">
            ← Fancam記事一覧を見る
        </a>
    </div>
</div>

<div class="contents_block fancam-filter-toolbar">
    <button type="button" id="open-fancam-filters" class="fancam-filter-open-button">
        絞り込み
    </button>

    <p id="fancam-filter-summary" class="fancam-filter-summary">
        絞り込み条件なし
    </p>
</div>

<div id="fancam-filter-modal" class="fancam-filter-modal" aria-hidden="true">
    <div class="fancam-filter-dialog" role="dialog" aria-modal="true" aria-labelledby="fancam-filter-modal-title">
        <div class="fancam-filter-modal-header">
            <h3 id="fancam-filter-modal-title">
                Fancamを絞り込む
            </h3>

            <button type="button" id="close-fancam-filters" class="fancam-filter-close-button" aria-label="絞り込みを閉じる">
                ×
            </button>
        </div>

        <div id="fancam-filters" class="fancam-filter-modal-body">
            <div class="list-loading">
                <svg role="img" aria-label="リボン">
                    <use href="#butterfly"></use>
                </svg>
                Loading...
                <svg role="img" aria-label="リボン">
                    <use href="#butterfly"></use>
                </svg>
            </div>
        </div>

        <div class="fancam-filter-modal-actions">
            <button type="button" id="reset-filters" class="fancam-filter-action-button">
                リセット
            </button>

            <button type="button" id="apply-filters" class="fancam-filter-action-button fancam-filter-action-primary">
                <span class="word-chunk">この条件で</span><span class="word-chunk">絞り込む</span>
            </button>
        </div>
    </div>
</div>

<div id="fancam-post-list-block" class="contents_block">

    <div id="fancam-post-list" class="fancam-post-grid">
        <div class="fancam-post-grid-loading">
            <div class="list-loading">
                <svg role="img" aria-label="リボン">
                    <use href="#butterfly"></use>
                </svg>
                Loading...
                <svg role="img" aria-label="リボン">
                    <use href="#butterfly"></use>
                </svg>
            </div>
        </div>
    </div>

    <div id="fancam-post-pagination"></div>

</div>

<script src="/static/js/fancam_public.js"></script>
<script src="/static/js/fancam_report.js"></script>
<script src="/static/js/fancam_posts.js"></script>
