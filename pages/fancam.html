<div id="page-title" style="display: none;">Fancam [誘蛾灯の導き]</div>
<div id="page-description" style="display: none;">ハイネにより撮影されたライブ映像。</div>

<style>
    .pagination_radio {
        display: none;
    }

    .pagination_label {
        display: inline-block;
        width: 15%;
        background-color: rgba(50, 50, 50, 0.9);
        border: 1px solid #aaaaaa;
        text-align: center;
    }

    .pagination {
        display: flex;
        justify-content: center;
    }

    .pagination_range {
        text-align: center;
    }

    input[type="radio"]:checked+label.pagination_label {
        background-color: rgba(150, 150, 150, 0.9);
    }
</style>

<div class="contents_block">
    <h1 class="glitch-text">ファントムシータ Fancam</h1>
</div>

<div id="fancam-content">
    <div class="contents_block">
        <div class="list-loading">
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
            Loading...
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
        </div>
    </div>
</div>

<div class="contents_block contents_block_has_a">
    <a class="contents_block_a" href="/?p=fancam-list"></a>
    <p>
        ⬅︎ 一覧へ戻る
    </p>
</div>

<script>
    // =========================================
    // 共通：ページネーション
    // =========================================

    function createPagination(currentPage, totalPages, startIndex, endIndex, totalCount, isBottom = false) {
        if (totalPages <= 1) {
            return "";
        }

        const pages = [];

        if (totalPages <= 5) {
            for (let i = 1; i <= totalPages; i++) {
                pages.push(i);
            }
        } else if (currentPage <= 3) {
            pages.push(1, 2, 3, 4);
            pages.push(0);
            pages.push(totalPages);
        } else if (currentPage >= totalPages - 2) {
            pages.push(1);
            pages.push(0);
            pages.push(
                totalPages - 3,
                totalPages - 2,
                totalPages - 1,
                totalPages
            );
        } else {
            pages.push(1);
            pages.push(0);
            pages.push(currentPage - 1, currentPage, currentPage + 1);
            pages.push(0);
            pages.push(totalPages);
        }

        const name = isBottom ? "pagination_page_bottom" : "pagination_page";
        const suffix = isBottom ? "_" : "";

        const pageHtml = pages.map(page => {
            if (page === 0) {
                return "<span>-</span>";
            }

            return `
                <input
                    type="radio"
                    class="pagination_radio"
                    name="${name}"
                    value="${page}"
                    id="pagination_page_${page}${suffix}"
                    ${page === currentPage ? "checked" : ""}>
                <label
                    class="pagination_label"
                    for="pagination_page_${page}${suffix}">
                    ${page}
                </label>
            `;
        }).join("");

        return `
            <div class="contents_block">
                <div class="pagination">
                    ${pageHtml}
                </div>
                <p class="pagination_range">
                    ${startIndex} - ${endIndex} / ${totalCount}
                </p>
            </div>
        `;
    }

    document.addEventListener("click", function (event) {
        if (event.target.matches(".pagination_radio")) {
            const url = new URL(window.location.href);
            url.searchParams.set("page", event.target.value);
            window.location.href = url.href;
        }
    });


    // =========================================
    // 共通：HTMLエスケープ
    // =========================================

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // =========================================
    // Fancam詳細
    // =========================================

    async function loadFancam() {
        const content = document.getElementById("fancam-content");
        const params = new URLSearchParams(window.location.search);
        const pid = params.get("pid");

        if (!pid) {
            showNotFound();
            return;
        }

        let page = parseInt(params.get("page") || "1", 10);

        if (!Number.isInteger(page) || page < 1) {
            page = 1;
        }

        try {
            const response = await fetch(
                "https://g-api.mothlamp.info/api?target=fancam"
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            const item = data.find(item => item.pid === pid);

            if (!item || item.private) {
                showNotFound();
                return;
            }

            const urls = item.urls
                ? item.urls
                    .split(/\r?\n/)
                    .map(url => url.trim())
                    .filter(url => isValidXUrl(url))
                : [];

            const date = new Date(item.timestamp);

            const timestamp = date.toLocaleDateString("ja-JP", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            });

            // =========================================
            // ページング
            // =========================================

            const perPage = 10;
            const totalPages = Math.ceil(urls.length / perPage);

            if (page > totalPages && totalPages > 0) {
                page = totalPages;
            }

            const startIndex = (page - 1) * perPage;
            const pageUrls = urls.slice(
                startIndex,
                startIndex + perPage
            );

            const topPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageUrls.length,
                urls.length
            );

            const bottomPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageUrls.length,
                urls.length,
                true
            );


            // =========================================
            // X埋め込み
            // =========================================

            const tweetsHtml = pageUrls.map(url => `
                <div class="tweet-container">
                    <a class="twitter-tweet-data" href="${escapeHtml(url)}"></a>
                </div>
            `).join("");


            // =========================================
            // 表示
            // =========================================

            content.innerHTML = `
                <div class="contents_block">
                    <p class="block-description">
                        ${escapeHtml(item["username"])}
                    </p>

                    <h2>
                        ${escapeHtml(item.title)}
                    </h2>

                    <p class="update">
                        ( ${urls.length} 件 ) ${timestamp}
                    </p>
                </div>

                ${topPagination}

                <div class="contents_block">
                    ${tweetsHtml}
                </div>

                ${bottomPagination}
            `;

            loadTwitterWidgets();

        } catch (error) {
            console.error(
                "Fancamの取得に失敗しました:",
                error
            );

            content.innerHTML =
                "<p>Fancamの取得に失敗しました。</p>";
        }
    }


    // =========================================
    // Fancam専用：X URL検証
    // =========================================

    function isValidXUrl(url) {
        try {
            const parsed = new URL(url);

            if (parsed.protocol !== "https:") {
                return false;
            }

            if (parsed.hostname !== "x.com") {
                return false;
            }

            return /^\/[^/]+\/status\/\d+$/.test(parsed.pathname);

        } catch {
            return false;
        }
    }


    // =========================================
    // Fancam専用：X埋め込み
    // =========================================

    function loadTwitterWidgets() {
        if (window.twttr && window.twttr.widgets) {
            window.twttr.widgets.load();
            return;
        }

        if (
            document.querySelector(
                'script[src="https://platform.twitter.com/widgets.js"]'
            )
        ) {
            return;
        }

        const script = document.createElement("script");

        script.src =
            "https://platform.twitter.com/widgets.js";

        script.async = true;

        document.head.appendChild(script);
    }


    // =========================================
    // Fancam専用：404
    // =========================================

    async function showNotFound() {
        const contents = document.getElementById("contents");

        if (!contents) {
            return;
        }

        try {
            const response = await fetch("/pages/404.html");

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            contents.innerHTML = await response.text();

        } catch (error) {
            console.error("404ページの取得に失敗しました:", error);

            contents.innerHTML = `
                <div class="contents_block">
                    <h2>404</h2>
                    <p>ページが見つかりません。</p>
                </div>
            `;
        }
    }


    loadFancam();
</script>
