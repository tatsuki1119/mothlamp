<div id="page-title" style="display: none;">Fancam 一覧 [誘蛾灯の導き]</div>
<div id="page-description" style="display: none;">ハイネにより撮影されたライブ映像。</div>

<div class="contents_block">
    <h1 class="glitch-text">ファントムシータ Fancam まとめ</h1>
</div>

<div class="contents_block contents_block_has_a">
    <a class="contents_block_a" href="https://forms.gle/Stnwro77Mi635AEc8"></a>
    <h3>＋新規作成はこちら</h3>
</div>

<div id="fancam-list-content">
    <div class="contents_block">
        <div class="list-loading">
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
            Loading...
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
        </div>
    </div>
</div>

<div class="load-content" data-loadfile="/pages/parts/fancam-notice"></div>

<script>
    function escapeHtml(value) {
        // HTMLエスケープ
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    async function loadFancamList() {
        const content = document.getElementById("fancam-list-content");
        const params = new URLSearchParams(window.location.search);

        let page = parseInt(params.get("page") || "1", 10);

        if (!Number.isInteger(page) || page < 1) {
            page = 1;
        }

        try {
            const response = await fetch(
                "https://g-api.mothlamp.info/api?target=fancam"
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            const items = data
                .filter(item =>
                    !item.private &&
                    item.report !== "reported" &&
                    item.report !== "ng"
                )
                .sort(
                    (a, b) =>
                        new Date(b.timestamp) - new Date(a.timestamp)
                );

            if (items.length === 0) {
                content.innerHTML =
                    "<p>公開されているFancamはありません。</p>";
                return;
            }

            // ページング
            const perPage = 20;
            const totalPages = Math.ceil(items.length / perPage);

            if (page > totalPages) {
                page = totalPages;
            }

            const startIndex = (page - 1) * perPage;
            const pageItems = items.slice(
                startIndex,
                startIndex + perPage
            );

            const topPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageItems.length,
                items.length
            );

            const bottomPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageItems.length,
                items.length,
                true
            );

            const listHtml = pageItems.map(item => {
                const urlCount = item.urls
                    ? item.urls
                        .split(/\r?\n/)
                        .map(url => url.trim())
                        .filter(url => isValidXUrl(url))
                        .length
                    : 0;

                const date = new Date(item.timestamp);

                const timestamp = date.toLocaleDateString("ja-JP", {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                });

                const url =
                    `/?p=fancam&pid=${encodeURIComponent(item.pid)}`;

                return `
                    <div class="contents_block contents_block_has_a">
                        <a class="contents_block_a" href="${url}"></a>
                        <p class="block-description">
                            ${escapeHtml(item["username"])}
                        </p>
                        <p style="margin-bottom:0.5em;">${escapeHtml(item.title)}</p>
                        <p class="update" style="right:-8px; bottom:-8px; fontsize:0.6rem">
                            ( ${urlCount} 件 ) ${timestamp}
                        </p>
                    </div>
                `;
            }).join("");

            content.innerHTML =
                topPagination +
                listHtml +
                bottomPagination;

        } catch (error) {
            console.error(
                "Fancam一覧の取得に失敗しました:",
                error
            );

            content.innerHTML =
                "<p>Fancamの取得に失敗しました。</p>";
        }
    }


    function isValidXUrl(url) {
        // X URL検証
        try {
            const parsed = new URL(url);

            if (parsed.protocol !== "https:") {
                return false;
            }

            if (parsed.hostname !== "x.com") {
                return false;
            }

            return /^\/[^/]+\/status\/\d+(?:\/.*)?$/.test(parsed.pathname);

        } catch {
            return false;
        }
    }

    loadFancamList();
</script>
