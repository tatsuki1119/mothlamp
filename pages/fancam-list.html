<div id="page-title" style="display: none;">Fancam [誘蛾灯の導き]</div>
<div id="page-description" style="display: none;">ハイネにより撮影されたライブ映像。</div>

<style>
    .pagination_radio {
        display: none;
    }

    .pagination_label {
        display: inline-block;
        width: 15%;
        background-color: rgba(50, 50, 50, 0.9);
        border: 1px solid #aaaaaa;
        text-align: center;
    }

    .pagination {
        display: flex;
        justify-content: center;
    }

    .pagination_range {
        text-align: center;
    }

    input[type="radio"]:checked+label.pagination_label {
        background-color: rgba(150, 150, 150, 0.9);
    }
</style>

<div class="contents_block">
    <h1 class="glitch-text">ファントムシータ Fancam</h1>
</div>

<div id="fancam-list-content">
    <div class="contents_block">
        <div class="list-loading">
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
            Loading...
            <svg role="img" aria-label="リボン">
                <use href="#butterfly"></use>
            </svg>
        </div>
    </div>
</div>

<script>
    // =========================================
    // 共通：ページネーション
    // =========================================

    function createPagination(currentPage, totalPages, startIndex, endIndex, totalCount, isBottom = false) {
        if (totalPages <= 1) {
            return "";
        }

        const pages = [];

        if (totalPages <= 5) {
            for (let i = 1; i <= totalPages; i++) {
                pages.push(i);
            }
        } else if (currentPage <= 3) {
            pages.push(1, 2, 3, 4);
            pages.push(0);
            pages.push(totalPages);
        } else if (currentPage >= totalPages - 2) {
            pages.push(1);
            pages.push(0);
            pages.push(
                totalPages - 3,
                totalPages - 2,
                totalPages - 1,
                totalPages
            );
        } else {
            pages.push(1);
            pages.push(0);
            pages.push(currentPage - 1, currentPage, currentPage + 1);
            pages.push(0);
            pages.push(totalPages);
        }

        const name = isBottom ? "pagination_page_bottom" : "pagination_page";
        const suffix = isBottom ? "_" : "";

        const pageHtml = pages.map(page => {
            if (page === 0) {
                return "<span>-</span>";
            }

            return `
                <input
                    type="radio"
                    class="pagination_radio"
                    name="${name}"
                    value="${page}"
                    id="pagination_page_${page}${suffix}"
                    ${page === currentPage ? "checked" : ""}>
                <label
                    class="pagination_label"
                    for="pagination_page_${page}${suffix}">
                    ${page}
                </label>
            `;
        }).join("");

        return `
            <div class="contents_block">
                <div class="pagination">
                    ${pageHtml}
                </div>
                <p class="pagination_range">
                    ${startIndex} - ${endIndex} / ${totalCount}
                </p>
            </div>
        `;
    }

    document.addEventListener("click", function (event) {
        if (event.target.matches(".pagination_radio")) {
            const url = new URL(window.location.href);
            url.searchParams.set("page", event.target.value);
            window.location.href = url.href;
        }
    });


    // =========================================
    // Fancam専用処理
    // =========================================

    async function loadFancamList() {
        const content = document.getElementById("fancam-list-content");
        const params = new URLSearchParams(window.location.search);

        let page = parseInt(params.get("page") || "1", 10);

        if (!Number.isInteger(page) || page < 1) {
            page = 1;
        }

        try {
            const response = await fetch(
                "https://g-api.mothlamp.info/api?target=fancam"
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            const items = data
                .filter(item => !item.private)
                .sort(
                    (a, b) =>
                        new Date(b.timestamp) - new Date(a.timestamp)
                );

            if (items.length === 0) {
                content.innerHTML =
                    "<p>公開されているFancamはありません。</p>";
                return;
            }

            const perPage = 50;
            const totalPages = Math.ceil(items.length / perPage);

            if (page > totalPages) {
                page = totalPages;
            }

            const startIndex = (page - 1) * perPage;
            const pageItems = items.slice(
                startIndex,
                startIndex + perPage
            );

            const topPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageItems.length,
                items.length
            );

            const bottomPagination = createPagination(
                page,
                totalPages,
                startIndex + 1,
                startIndex + pageItems.length,
                items.length,
                true
            );

            const listHtml = pageItems.map(item => {
                const urlCount = item.urls
                    ? item.urls
                        .split(/\r?\n/)
                        .filter(url => url.trim())
                        .length
                    : 0;

                const date = new Date(item.timestamp);

                const timestamp = date.toLocaleDateString("ja-JP", {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                });

                const url =
                    `/?p=fancam&pid=${encodeURIComponent(item.pid)}`;

                return `
                    <div class="contents_block contents_block_has_a">
                        <a class="contents_block_a" href="${url}"></a>
                        <p class="block-description">
                            ${escapeHtml(item["username"])}
                        </p>
                        <p>${escapeHtml(item.title)}</p>
                        <p class="update">
                            ( ${urlCount} 件 ) ${timestamp}
                        </p>
                    </div>
                `;
            }).join("");

            content.innerHTML =
                topPagination +
                listHtml +
                bottomPagination;

        } catch (error) {
            console.error(
                "Fancam一覧の取得に失敗しました:",
                error
            );

            content.innerHTML =
                "<p>Fancamの取得に失敗しました。</p>";
        }
    }


    // =========================================
    // 共通：HTMLエスケープ
    // =========================================

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    loadFancamList();
</script>
